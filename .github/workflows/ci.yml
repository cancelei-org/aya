name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-build:
    name: Lint and Build
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate mise
        run: |
          echo "/opt/mise/shims" >> $GITHUB_PATH
          echo "/root/.local/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build
        env:
          # Dummy env vars so clients can initialize during Next.js
          # static page collection without real credentials
          DATABASE_URL: "postgresql://user:pass@localhost:5432/aya_build"
          OPENAI_API_KEY: "sk-dummy-build-key"
          ANTHROPIC_API_KEY: "sk-ant-dummy-build-key"
          NEXTAUTH_SECRET: "dummy-build-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          PERPLEXITY_API_KEY: "dummy"
          GOOGLE_API_KEY: "dummy"
          GOOGLE_SEARCH_ENGINE_ID: "dummy"
        run: npm run build
