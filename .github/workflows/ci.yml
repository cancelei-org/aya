name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint & Build
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate mise
        run: |
          echo "/opt/mise/shims" >> $GITHUB_PATH
          echo "/root/.local/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    needs: [lint-build]
    if: github.event_name == 'push'
    uses: cancelei-org/flukebase/.github/workflows/reusable-build.yml@main
    permissions:
      contents: read
      packages: write

  notify:
    name: CI Notify
    needs: [lint-build, docker]
    if: always()
    uses: cancelei-org/flukebase/.github/workflows/reusable-ci-notify.yml@main
    with:
      project_slug: "aya"
      job_results: |
        Lint & Build=${{ needs.lint-build.result }}
        Docker=${{ needs.docker.result }}
    secrets:
      MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
