name: Notify Discord

on:
  push:
    branches:
      - main

jobs:
  discord-notify:
    runs-on: [self-hosted, linux]
    # Only run if Discord webhook is configured
    if: ${{ vars.DISCORD_NOTIFICATIONS_ENABLED == 'true' }}
    timeout-minutes: 2

    steps:
      - name: Send embed notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set, skipping notification"
            exit 0
          fi
          curl -sf -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "New Push to Main",
                   "description": "Repository: `'"${{ github.repository }}"'`\nPushed by: `'"${{ github.actor }}"'`\nCommit: `'"${{ github.sha }}"'`",
                   "color": 5814783,
                   "timestamp": "'"$(date --utc +%Y-%m-%dT%H:%M:%SZ)"'"
                 }]
               }' \
               "$DISCORD_WEBHOOK_URL"
